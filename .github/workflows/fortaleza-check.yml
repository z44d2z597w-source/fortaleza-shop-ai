name: Revisar FORTALEZA SHOP AI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Comprobar sintaxis
        run: python -m compileall -q .
      - name: Revisar estructura y dependencias
        run: python core/pipeline_check.py
      - name: Probar importación de módulos
        run: python core/system_test.py
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Verificar CLI
        run: python main.py --help
